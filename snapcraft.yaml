name: visualboyadvance-m
version: 2.1.11
summary: Nintendo Game Boy Advance Emulator
description: |
  An open-source Nintendo Game Boy, Super Game Boy, Game Boy Advance Emulators.

grade: stable
confinement: strict
base: core24

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

parts:
  wxwidgets:
    source: https://github.com/wxWidgets/wxWidgets.git
    plugin: nil
    source-tag: 'v3.2.6'
    override-build: |
      cp -p /usr/share/automake-*/config.{sub,guess} .
      autoconf -f -B build/autoconf_prepend-include
      ./configure --with-opengl --enable-glcanvasegl --prefix=/usr
      make -j$(nproc)
      make install
      make install DESTDIR=$CRAFT_PART_INSTALL
    build-packages:
      - automake
      - libgtk-3-dev
    prime:
      - -usr/bin/wx-config

  vbam:
    after: [wxwidgets]
    source: https://github.com/visualboyadvance-m/visualboyadvance-m/archive/v2.1.11.tar.gz
    override-build: |
      snapcraftctl build
      sed -i.bak -e 's|Icon=visualboyadvance-m|Icon=/usr/share/icons/hicolor/scalable/apps/visualboyadvance-m.svg|g' /root/parts/vbam/install/usr/share/applications/visualboyadvance-m.desktop
    plugin: cmake
    stage-packages:
      - libsdl2-2.0-0
      - libsfml-network2.6
      - libsfml-system2.6
      - libnotify4
      - libsm6
      - libopenal1
      - libpng16-16
      - libpulse0
      - zlib1g
      - libgtk-3-0
      - libgl1
      - libglvnd0
      - libglx0
      - libopengl0

    build-packages:
      - g++
      - gcc
      - make
      - cmake
      - pkg-config
      - git
      - zip
      - libnotify-dev
      - libsdl2-dev
      - libsfml-dev
      - libgtk-3-dev
      - libopenal-dev
    cmake-parameters:
      - -DENABLE_OPENAL=ON
      - -DENABLE_SDL=OFF
      - -DBUILD_TESTING=OFF
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DwxWidgets_INCLUDE_DIRS=$CRAFT_STAGE/usr/include/wx-3.2

apps:
  visualboyadvance-m:
    plugs:
      - desktop
      - desktop-legacy
      - audio-playback
      - opengl
      - joystick
      - raw-usb
      - screen-inhibit-control
      - home
      - removable-media
      - network
      - wayland
      - x11
    command: usr/bin/visualboyadvance-m
    desktop: usr/share/applications/visualboyadvance-m.desktop
    extensions: [gnome]
    environment:
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/pulseaudio
